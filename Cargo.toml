[package]
name = "dev-location-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"

[dependencies]
actix-web = "4.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "=0.9.33"
tokio = { version = "1.45", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.17", features = ["v4"] }
strsim = "0.11"
rand = "0.9.1"
env_logger = "0.11"
async-trait = "0.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3" }
tracing-appender = "0.2"
celes = "2.6.0"
